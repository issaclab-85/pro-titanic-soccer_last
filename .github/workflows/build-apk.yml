name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Install Capacitor packages
        run: npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor JSON
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.srstudio.protitanicsoccer",
            "appName": "Pro Titanic Soccer",
            "webDir": "dist"
          }
          EOF

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web build to Android
        run: npx cap sync android

      - name: Force Landscape orientation in AndroidManifest
        run: |
          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          tree = ET.parse(path)
          root = tree.getroot()
          app_elem = root.find("application")
          if app_elem is not None:
              for act in app_elem.findall("activity"):
                  act.set(f"{{{android_ns}}}screenOrientation", "sensorLandscape")
                  break

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PYEOF

      - name: Enable Immersive Sticky Fullscreen in MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/srstudio/protitanicsoccer
          cat << 'EOF' > android/app/src/main/java/com/srstudio/protitanicsoccer/MainActivity.java
          package com.srstudio.protitanicsoccer;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  applyImmersiveMode();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      applyImmersiveMode();
                  }
              }

              private void applyImmersiveMode() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  View decorView = getWindow().getDecorView();
                  WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(getWindow(), decorView);
                  controller.hide(WindowInsetsCompat.Type.statusBars() | WindowInsetsCompat.Type.navigationBars());
                  controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              }
          }
          EOF

      - name: Fix Kotlin stdlib duplicate classes
        run: |
          python3 - << 'PYEOF'
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          constraint_block = """dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
              }"""

          if "kotlin-stdlib-jdk8:1.8.22" not in content and "dependencies {" in content:
              content = content.replace("dependencies {", constraint_block, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          PYEOF

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Titanic-Soccer-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
